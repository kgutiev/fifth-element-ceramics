<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Fifth Element Ceramics</title>
  <style>
    :root { --bg: #fff; --text: #1a1a1a; --card: #f6f8fa; --border: #d0d7de; --primary: #2ea44f; --danger: #cf222e; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --text: #e6edf3; --card: #161b22; --border: #30363d; --primary: #238636; --danger: #f85149; --link: #58a6ff; } }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    input, select { width: 100%; padding: 0.5rem; margin: 0.25rem 0 0.5rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
    button { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { opacity: 0.9; }
    button.danger { background: var(--danger); }
    button.secondary { background: var(--link); }
    .hidden { display: none !important; }
    .error { background: #ffebe9; color: var(--danger); padding: 1rem; border-radius: 6px; margin: 1rem 0; border: 1px solid #ffcecb; }
    .success { background: #dafbe1; color: #1a7f37; padding: 1rem; border-radius: 6px; margin: 1rem 0; border: 1px solid #4ac26b; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .tab { padding: 0.5rem 1rem; border: none; background: transparent; color: var(--text); cursor: pointer; border-radius: 6px 6px 0 0; font-weight: 500; }
    .tab:hover { background: var(--card); }
    .tab.active { background: var(--link); color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .product-grid { display: grid; gap: 1rem; }
    @media (min-width: 768px) { .product-grid { grid-template-columns: 1fr 1fr; } }
    .product-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; gap: 1rem; }
    .product-title { font-weight: 600; font-size: 1.1rem; margin: 0; }
    .product-info { color: #666; font-size: 0.9rem; margin: 0.25rem 0; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .featured-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.5rem; }
    .featured-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #eee; }
    .contact-grid { display: grid; gap: 1rem; }
    @media (min-width: 600px) { .contact-grid { grid-template-columns: 1fr 1fr; } }
    a { color: var(--link); text-decoration: none; }
    .loading { text-align: center; padding: 2rem; color: #666; }
    .small { font-size: 0.85rem; color: #666; }
    .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; background: #eee; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛠 Админка</h1>
      <div id="user-block" class="hidden">
        <span id="user-name" style="margin-right: 0.75rem;"></span>
        <button onclick="logout()" class="danger">Выйти</button>
      </div>
    </div>

    <div id="login-block" class="card">
      <h2>Вход</h2>
      <p>Для редактирования авторизуйтесь через GitHub.</p>
      <button onclick="login()">🔐 Войти через GitHub</button>
      <p class="small" style="margin-top:1rem">Приложение: <strong>Fifth Element Admin</strong></p>
    </div>

    <div id="error-block" class="error hidden"></div>
    <div id="success-block" class="success hidden">✅ Сохранено! <a href="https://5elementceramics.ru/" target="_blank">Посмотреть сайт</a></div>

    <div id="app-block" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="products">📦 Товары</button>
        <button class="tab" data-tab="featured">⭐ Избранное</button>
        <button class="tab" data-tab="contacts">📞 Контакты</button>
      </div>

      <div id="tab-products" class="tab-content active">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
          <h2>Все товары (<span id="count">0</span>)</h2>
          <button class="secondary" onclick="loadProducts()">🔄 Обновить</button>
        </div>
        <div id="products-list" class="product-grid"></div>
      </div>

      <div id="tab-featured" class="tab-content">
        <h2>Избранные товары на главной</h2>
        <p class="small">Выберите товары, которые будут показаны на главной странице.</p>
        <div id="featured-list" style="margin-top:1rem"></div>
        <button onclick="saveFeatured()" style="margin-top:1rem">💾 Сохранить избранное</button>
      </div>

      <div id="tab-contacts" class="tab-content">
        <h2>Контакты</h2>
        <p class="small">Эти данные отображаются в футере сайта.</p>
        <div class="card" style="margin-top:1rem">
          <div class="contact-grid">
            <div><label>📍 Город</label><input type="text" id="contact-city"></div>
            <div><label>📞 Телефон</label><input type="text" id="contact-phone"></div>
            <div><label>✉️ Email</label><input type="email" id="contact-email"></div>
            <div><label>📷 Instagram</label><input type="url" id="contact-instagram"></div>
            <div><label>✈️ Telegram</label><input type="url" id="contact-telegram"></div>
          </div>
          <button onclick="saveContacts()" style="margin-top:1rem">💾 Сохранить контакты</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      clientId: 'Ov23liPIQAvQTIDuqmdL',
      repo: 'kgutiev/fifth-element-ceramics',
      branch: 'main',
      productsPath: 'data/products.json',
      homepagePath: 'data/homepage.json'
    };

    function login() {
      const redirect = encodeURIComponent(window.location.href.split('?')[0]);
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${CONFIG.clientId}&redirect_uri=${redirect}&scope=repo`;
    }
    function logout() { localStorage.removeItem('gh_token'); window.location.reload(); }

    // 🔐 Авторизация
    async function handleAuth() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get('code');
      if (code) {
        alert('⚠️ Создайте "Personal Access Token (classic)" в GitHub Settings → Developer settings с галочкой "repo" и вставьте его ниже.');
        const token = prompt('Вставьте ваш GitHub Personal Access Token (начинается с ghp_):');
        if (token && token.startsWith('ghp_')) {
          localStorage.setItem('gh_token', token);
          url.searchParams.delete('code');
          window.history.replaceState({}, '', url);
        }
      }
      const token = localStorage.getItem('gh_token');
      if (token) {
        try {
          const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
          if (res.ok) {
            const user = await res.json();
            document.getElementById('user-name').textContent = `@${user.login}`;
            document.getElementById('login-block').classList.add('hidden');
            document.getElementById('user-block').classList.remove('hidden');
            document.getElementById('app-block').classList.remove('hidden');
            setupTabs();
            await loadProducts(token);
            await loadHomepage(token);
          } else { showError('Неверный токен'); localStorage.removeItem('gh_token'); }
        } catch(e) { showError('Ошибка сети: ' + e.message); }
      }
    }

    // 🗂 Вкладки
    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
        });
      });
    }

    // 🔤 UTF-8 helpers
    function decodeUTF8Base64(b64) {
      const binary = window.atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    function encodeUTF8Base64(str) {
      const encoder = new TextEncoder();
      const encoded = encoder.encode(str);
      let binary = '';
      for (const byte of encoded) binary += String.fromCharCode(byte);
      return window.btoa(binary);
    }
    function toAbsoluteUrl(path) {
      if (!path) return '';
      return path.startsWith('http') ? path : `https://5elementceramics.ru/${path.replace(/^\.\//, '')}`;
    }

    // 📦 Загрузка товаров
    async function loadProducts(token) {
      if (!token) token = localStorage.getItem('gh_token');
      document.getElementById('products-list').innerHTML = '<p class="loading">Загрузка...</p>';
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.productsPath}?ref=${CONFIG.branch}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const content = JSON.parse(decodeUTF8Base64(data.content));
        window.productsSha = data.sha;
        window.productsData = content;
        renderProducts(content.products || []);
      } catch(e) { document.getElementById('products-list').innerHTML = `<p class="error">❌ ${e.message}</p>`; }
    }

    function renderProducts(products) {
      const list = document.getElementById('products-list');
      document.getElementById('count').textContent = products.length;
      if (!products.length) { list.innerHTML = '<p class="small">Товаров нет. Добавьте их через GitHub или вручную в products.json</p>'; return; }
      list.innerHTML = products.map((p, i) => `
        <div class="card">
          <div class="product-header">
            <div>
              <h3 class="product-title">${escapeHtml(p.title)}</h3>
              <p class="product-info small">${escapeHtml(p.info || '')}</p>
            </div>
            <img src="${toAbsoluteUrl(p.image)}" alt="" class="img-preview" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>📷</text></svg>'">
          </div>
          <label class="small">Путь к фото</label>
          <input type="text" id="img-${i}" value="${escapeHtml(p.image || '')}">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
            <div><label class="small">Цена (₽)</label><input type="number" id="price-${i}" value="${p.price}" min="0"></div>
            <div><label class="small">Статус</label><select id="status-${i}">${['В наличии','Продано','Под заказ'].map(s => `<option value="${s}"${p.status===s?' selected':''}>${s}</option>`).join('')}</select></div>
          </div>
          <div class="actions">
            <button onclick="saveProduct(${i}, '${escapeHtml(p.title)}')">💾 Сохранить</button>
            <button class="danger" onclick="deleteProduct(${i}, '${escapeHtml(p.title)}')">🗑 Удалить</button>
          </div>
        </div>
      `).join('');
    }

    async function saveProduct(index, title) {
      const token = localStorage.getItem('gh_token');
      const img = document.getElementById(`img-${index}`).value.trim();
      const price = document.getElementById(`price-${index}`).value;
      const status = document.getElementById(`status-${index}`).value;
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.productsPath}?ref=${CONFIG.branch}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await res.json();
        const json = JSON.parse(decodeUTF8Base64(data.content));
        json.products[index].image = img;
        json.products[index].price = Number(price);
        json.products[index].status = status;
        const updateRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.productsPath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify({ message: `admin: update ${title}`, content: encodeUTF8Base64(JSON.stringify(json, null, 2)), sha: data.sha, branch: CONFIG.branch })
        });
        if (updateRes.ok) { showSuccess(); loadProducts(token); }
        else { const err = await updateRes.json(); showError(err.message || 'Ошибка'); }
      } catch(e) { showError(e.message); }
    }

    async function deleteProduct(index, title) {
      if (!confirm(`Удалить "${title}"?`)) return;
      const token = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.productsPath}?ref=${CONFIG.branch}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        const data = await res.json();
        const json = JSON.parse(decodeUTF8Base64(data.content));
        json.products.splice(index, 1);
        const updateRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.productsPath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify({ message: `admin: delete ${title}`, content: encodeUTF8Base64(JSON.stringify(json, null, 2)), sha: data.sha, branch: CONFIG.branch })
        });
        if (updateRes.ok) { showSuccess(); loadProducts(token); loadHomepage(token); }
        else { const err = await updateRes.json(); showError(err.message || 'Ошибка'); }
      } catch(e) { showError(e.message); }
    }

    // ⭐ & 📞 Загрузка homepage.json
    async function loadHomepage(token) {
      if (!token) token = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.homepagePath}?ref=${CONFIG.branch}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.status === 404) {
          // Если файла нет, создаём дефолтный
          window.homepageData = { featured: [], contacts: { city: 'Сочи / Москва', phone: '', email: '', instagram: 'https://www.instagram.com/fifthelement.ceramics', telegram: '' } };
          await saveHomepageData(window.homepageData, 'init homepage.json');
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        window.homepageSha = data.sha;
        window.homepageData = JSON.parse(decodeUTF8Base64(data.content));
        renderFeaturedList();
        renderContactsForm();
      } catch(e) { console.error('Homepage load error:', e); showError('Не удалось загрузить homepage.json'); }
    }

    function renderFeaturedList() {
      const list = document.getElementById('featured-list');
      const featured = window.homepageData?.featured || [];
      const all = window.productsData?.products || [];
      if (!all.length) { list.innerHTML = '<p class="small">Сначала добавьте товары</p>'; return; }
      list.innerHTML = all.map(p => {
        const isFeatured = featured.some(f => f.title === p.title);
        return `
          <div class="featured-item">
            <img src="${toAbsoluteUrl(p.image)}" alt="">
            <div style="flex:1"><strong>${escapeHtml(p.title)}</strong><div class="small">${escapeHtml(p.info || '')}</div></div>
            <button class="${isFeatured ? 'danger' : 'secondary'}" onclick="toggleFeatured('${escapeHtml(p.title)}', ${!isFeatured})">
              ${isFeatured ? '✕ Убрать' : '+ Добавить'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleFeatured(title, add) {
      const featured = window.homepageData.featured || [];
      if (add) {
        const p = (window.productsData?.products || []).find(x => x.title === title);
        if (p && !featured.some(f => f.title === p.title)) featured.push({ ...p });
      } else {
        const idx = featured.findIndex(f => f.title === title);
        if (idx >= 0) featured.splice(idx, 1);
      }
      window.homepageData.featured = featured;
      renderFeaturedList();
    }

    async function saveFeatured() {
      await saveHomepageData(window.homepageData, 'admin: update featured');
    }

    function renderContactsForm() {
      const c = window.homepageData?.contacts || {};
      document.getElementById('contact-city').value = c.city || '';
      document.getElementById('contact-phone').value = c.phone || '';
      document.getElementById('contact-email').value = c.email || '';
      document.getElementById('contact-instagram').value = c.instagram || '';
      document.getElementById('contact-telegram').value = c.telegram || '';
    }

    async function saveContacts() {
      window.homepageData.contacts = {
        city: document.getElementById('contact-city').value.trim(),
        phone: document.getElementById('contact-phone').value.trim(),
        email: document.getElementById('contact-email').value.trim(),
        instagram: document.getElementById('contact-instagram').value.trim(),
        telegram: document.getElementById('contact-telegram').value.trim()
      };
      await saveHomepageData(window.homepageData, 'admin: update contacts');
    }

    async function saveHomepageData(data, message) {
      const token = localStorage.getItem('gh_token');
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.homepagePath}?ref=${CONFIG.branch}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        const sha = res.ok ? (await res.json()).sha : null;
        const updateRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.homepagePath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
          body: JSON.stringify({ message, content: encodeUTF8Base64(JSON.stringify(data, null, 2)), sha, branch: CONFIG.branch })
        });
        if (updateRes.ok) { showSuccess(); loadHomepage(token); }
        else { const err = await updateRes.json(); showError(err.message || 'Ошибка'); }
      } catch(e) { showError(e.message); }
    }

    function escapeHtml(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    function showError(msg) { const el = document.getElementById('error-block'); el.textContent = '⚠️ ' + msg; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 5000); }
    function showSuccess() { const el = document.getElementById('success-block'); el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 3000); }

    document.addEventListener('DOMContentLoaded', handleAuth);
  </script>
</body>
</html>
