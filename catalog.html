<script>
  // 1. Переключение темы
  (function(){
    const t = document.querySelector('[data-theme-toggle]');
    const r = document.documentElement;
    let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', d);
    if(t) t.addEventListener('click', () => {
      d = d === 'dark' ? 'light' : 'dark';
      r.setAttribute('data-theme', d);
      t.innerHTML = d === 'dark'
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    });
  })();

  // 2. Тень хедера при скролле
  window.addEventListener('scroll', () => {
    const header = document.getElementById('site-header');
    if(header) header.classList.toggle('site-header--scrolled', window.scrollY > 10);
  });

  // 3. Загрузка каталога + фильтры
  document.addEventListener('DOMContentLoaded', () => {
    const jsonUrl = new URL('./data/products.json', window.location.href).toString();
    const grid = document.getElementById('product-grid');

    fetch(jsonUrl)
      .then(res => {
        if (!res.ok) throw new Error('Сервер вернул ' + res.status);
        return res.json();
      })
      .then(data => {
        if (!grid || !data.products?.length) return;
        grid.innerHTML = data.products.map(p => `
          <div class="product-card fade-in" data-category="${p.category || 'all'}">
            <div class="product-card-image">
              <img src="${p.image}" alt="${p.title}" loading="lazy" width="570" height="760">
            </div>
            <div class="product-card-body">
              <h3 class="product-card-title">${p.title}</h3>
              <p class="product-card-info">${p.info}</p>
              <p class="product-card-price">${Number(p.price).toLocaleString('ru-RU')} ₽</p>
              ${p.status ? `<span class="product-card-tag">${p.status}</span>` : ''}
            </div>
          </div>
        `).join('');
        initFilters();
      })
      .catch(err => {
        console.error('⚠️ Ошибка загрузки:', err);
        if(grid) grid.innerHTML = `<p style="text-align:center;color:#e74c3c;padding:2rem;">Каталог временно недоступен. Обновите страницу.</p>`;
      });

    function initFilters() {
      const tabs = document.getElementById('filter-tabs');
      if (!tabs) return;
      tabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        const filter = tab.dataset.filter;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.product-card').forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.category === filter) ? '' : 'none';
        });
      });
    }
    initFilters();
  });
</script>
