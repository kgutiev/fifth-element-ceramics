backend:
  name: github
  repo: "ВАШ_ЛОГИН/ИМЯ_РЕПОЗИТОРИЯ"
  branch: main
  client_id: "ВАШ_CLIENT_ID_ИЗ_OAUTH_APP"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "products"
    label: "Каталог товаров"
    file: "data/products.json"
    format: "json"
    fields:
      - name: "products"
        label: "Товары"
        widget: "list"
        fields:
          - { name: "title", label: "Название", widget: "string" }
          - { name: "info", label: "Описание", widget: "string" }
          - { name: "price", label: "Цена", widget: "number" }
          - { name: "height", label: "Размер", widget: "string" }
          - { name: "image", label: "Фото", widget: "image" }
          - name: "category"
            label: "Категория"
            widget: "select"
            options: ["vases", "pots", "decor"]
            default: "vases"
          - name: "status"
            label: "Статус"
            widget: "select"
            options: ["В наличии", "Продано", "Под заказ"]
            default: "В наличии"

  - name: "homepage"
    label: "Главная / Контакты"
    file: "data/homepage.json"
    format: "json"
    fields:
      - name: "featured"
        label: "Избранные работы"
        widget: "list"
        fields:
          - { name: "title", label: "Название", widget: "string" }
          - { name: "info", label: "Описание", widget: "string" }
          - { name: "price", label: "Цена", widget: "number" }
          - { name: "height", label: "Размер", widget: "string" }
          - { name: "image", label: "Фото", widget: "image" }
      - name: "contacts"
        label: "Контакты"
        widget: "object"
        fields:
          - { name: "city", label: "Город", widget: "string" }
          - { name: "phone", label: "Телефон", widget: "string", required: false }
          - { name: "email", label: "Email", widget: "string", required: false }
          - { name: "instagram", label: "Instagram", widget: "string" }
          - { name: "telegram", label: "Telegram", widget: "string" }
