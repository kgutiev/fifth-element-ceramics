backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "products"
    label: "Каталог товаров"
    file: "data/products.json"
    fields:
      - label: "Все товары"
        name: "products"
        widget: "list"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Описание", name: "info", widget: "string" }
          - { label: "Цена", name: "price", widget: "number" }
          - { label: "Высота", name: "height", widget: "string", required: false }
          - { label: "Фото", name: "image", widget: "image" }

  - name: "homepage"
    label: "Главная страница"
    file: "data/homepage.json"
    fields:
      - label: "Избранные работы"
        name: "featured"
        widget: "list"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Описание", name: "info", widget: "string" }
          - { label: "Цена", name: "price", widget: "number" }
          - { label: "Высота", name: "height", widget: "string", required: false }
          - { label: "Фото", name: "image", widget: "image" }

      - label: "Контакты"
        name: "contacts"
        widget: "object"
        fields:
          - { label: "Город", name: "city", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Ссылка Instagram", name: "instagram", widget: "string" }
          - { label: "Ссылка Telegram", name: "telegram", widget: "string" }
