<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fifth Element</title>
</head>
<body>
  <!-- 1. Флаг ручной инициализации (ОБЯЗАТЕЛЬНО ДО основного скрипта) -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>

  <!-- 2. Загрузка библиотеки -->
  <script src="https://unpkg.com/decap-cms@3.0.12/dist/decap-cms.js"></script>

  <!-- 3. Инициализация только после полной загрузки DOM и библиотеки -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof CMS === 'undefined') {
        document.body.innerHTML = '<h2 style="color:red; padding:2rem;">⚠️ CMS не загрузился. Проверьте интернет или попробуйте позже.</h2>';
        return;
      }

      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'kgutiev/fifth-element-ceramics',
            branch: 'main', // ⚠️ Если в GitHub ветка называется master, замените на 'master'
            client_id: 'Ov23liPIQAvQTIDuqmdL'
          },
          media_folder: 'assets/uploads',
          public_folder: '/assets/uploads',
          collections: [
            {
              name: 'products',
              label: 'Каталог товаров',
              files: [{
                name: 'products_file',
                label: 'Товары',
                file: 'data/products.json',
                format: 'json',
                fields: [{
                  name: 'products',
                  label: 'Список',
                  widget: 'list',
                  fields: [
                    { name: 'title', label: 'Название', widget: 'string' },
                    { name: 'info', label: 'Описание', widget: 'string' },
                    { name: 'price', label: 'Цена', widget: 'number' },
                    { name: 'height', label: 'Размер', widget: 'string' },
                    { name: 'image', label: 'Фото', widget: 'image' },
                    { name: 'category', label: 'Категория', widget: 'select', options: ['vases','pots','decor'] },
                    { name: 'status', label: 'Статус', widget: 'select', options: ['В наличии','Продано','Под заказ'] }
                  ]
                }]
              }]
            },
            {
              name: 'homepage',
              label: 'Главная / Контакты',
              files: [{
                name: 'homepage_file',
                label: 'Данные главной',
                file: 'data/homepage.json',
                format: 'json',
                fields: [
                  { name: 'featured', label: 'Избранное', widget: 'list', fields: [
                    { name: 'title', label: 'Название', widget: 'string' },
                    { name: 'info', label: 'Описание', widget: 'string' },
                    { name: 'price', label: 'Цена', widget: 'number' },
                    { name: 'height', label: 'Размер', widget: 'string' },
                    { name: 'image', label: 'Фото', widget: 'image' }
                  ]},
                  { name: 'contacts', label: 'Контакты', widget: 'object', fields: [
                    { name: 'city', label: 'Город', widget: 'string' },
                    { name: 'phone', label: 'Телефон', widget: 'string' },
                    { name: 'email', label: 'Email', widget: 'string' },
                    { name: 'instagram', label: 'Instagram', widget: 'string' },
                    { name: 'telegram', label: 'Telegram', widget: 'string' }
                  ]}
                ]
              }]
            }
          ]
        }
      });
    });
  </script>
</body>
</html>
