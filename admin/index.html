<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.0.12/dist/decap-cms.js?t=999"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CMS.init({
        load_config_file: false,
        backend: {
          name: 'github',
          repo: 'kgutiev/fifth-element-ceramics',
          branch: 'main',
          client_id: 'Ov23liPIQAvQTIDuqmdL'
        },
        media_folder: 'assets/uploads',
        public_folder: '/assets/uploads',
        collections: [
          { name: 'products', label: 'Каталог', files: [{ name: 'p', label: 'Товары', file: 'data/products.json', format: 'json', fields: [{ name: 'products', label: 'Список', widget: 'list', fields: [{ name: 'title', label: 'Название', widget: 'string' }, { name: 'info', label: 'Описание', widget: 'string' }, { name: 'price', label: 'Цена', widget: 'number' }, { name: 'height', label: 'Размер', widget: 'string' }, { name: 'image', label: 'Фото', widget: 'image' }, { name: 'category', label: 'Категория', widget: 'select', options: ['vases','pots','decor'] }, { name: 'status', label: 'Статус', widget: 'select', options: ['В наличии','Продано','Под заказ'] }] }] }] },
          { name: 'homepage', label: 'Главная', files: [{ name: 'h', label: 'Данные', file: 'data/homepage.json', format: 'json', fields: [{ name: 'featured', label: 'Избранное', widget: 'list', fields: [{ name: 'title', label: 'Название', widget: 'string' }, { name: 'info', label: 'Описание', widget: 'string' }, { name: 'price', label: 'Цена', widget: 'number' }, { name: 'height', label: 'Размер', widget: 'string' }, { name: 'image', label: 'Фото', widget: 'image' }] }, { name: 'contacts', label: 'Контакты', widget: 'object', fields: [{ name: 'city', label: 'Город', widget: 'string' }, { name: 'phone', label: 'Телефон', widget: 'string' }, { name: 'email', label: 'Email', widget: 'string' }, { name: 'instagram', label: 'Instagram', widget: 'string' }, { name: 'telegram', label: 'Telegram', widget: 'string' }] }] }] }
        ]
      });
    });
  </script>
</body>
</html>
